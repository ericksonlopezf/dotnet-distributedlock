name: Native AOT Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/EricksonLopez.DistributedLock.AotSmokeTest/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/aot-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aot-smoke-test:
    name: AOT (${{ matrix.os }} - ${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary_path: tests/EricksonLopez.DistributedLock.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/EricksonLopez.DistributedLock.AotSmokeTest
          - os: windows-latest
            rid: win-x64
            binary_path: tests/EricksonLopez.DistributedLock.AotSmokeTest/bin/Release/net10.0/win-x64/publish/EricksonLopez.DistributedLock.AotSmokeTest.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore AOT Smoke Test
        run: dotnet restore tests/EricksonLopez.DistributedLock.AotSmokeTest/EricksonLopez.DistributedLock.AotSmokeTest.csproj -r ${{ matrix.rid }}

      - name: Native AOT Publish
        run: |
          dotnet publish tests/EricksonLopez.DistributedLock.AotSmokeTest/EricksonLopez.DistributedLock.AotSmokeTest.csproj -c Release -r ${{ matrix.rid }} --self-contained /p:PublishAot=true /p:EnableSourceLink=false

      - name: Execute Native AOT Smoke Binary
        shell: bash
        run: |
          chmod +x "${{ matrix.binary_path }}" || true
          "${{ matrix.binary_path }}"
